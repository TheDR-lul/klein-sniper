[package]
name = "klein-sniper"
version = "0.1.1"
edition = "2024"

[dependencies]
tokio = { version = "1.44.2", features = ["full", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.15", features = ["blocking","json","gzip","brotli","deflate"] }
chrono = { version = "0.4.40", features = ["serde"] }
scraper = "0.23.1"
rusqlite = { version = "0.34.0", features = ["chrono","bundled"] }
thiserror = "2.0.12"
async-trait = "0.1.88"
tracing ="0.1.41"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
rand ="0.9.0"
futures = "0.3.31"
teloxide = { version = "0.14", features = ["macros", "ctrlc_handler"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["timeout"] }
governor = "0.7"
backoff = { version = "0.4", features = ["tokio"] }

[build-dependencies]
winres = "0.1"